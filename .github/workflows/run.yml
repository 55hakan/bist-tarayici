name: BIST Sinyal Tarayici

on:
  schedule:
    - cron: '20 7 * * 1-5'   # 10:20
    - cron: '20 8 * * 1-5'   # 11:20
    - cron: '20 9 * * 1-5'   # 12:20
    - cron: '20 10 * * 1-5'  # 13:20
    - cron: '20 11 * * 1-5'  # 14:20
    - cron: '20 12 * * 1-5'  # 15:20
    - cron: '20 13 * * 1-5'  # 16:20
    - cron: '20 14 * * 1-5'  # 17:20
    - cron: '20 15 * * 1-5'  # 18:20 (Kapanış)
  workflow_dispatch:
jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install pandas numpy requests yfinance

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner.py

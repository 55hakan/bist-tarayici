name: BIST Sinyal Tarayici

on:
  schedule:
    # Türkiye saatiyle 10:20'de başlar, her saat 20 geçe çalışır ve 18:20'de son taramasını yapar
    - cron: '20 7-15 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install pandas numpy requests yfinance

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python scanner.py
